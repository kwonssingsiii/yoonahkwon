<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 아래 두 값은 /api/portfolio 응답으로 덮어써집니다(render/meta.js). -->
  <title>권윤아 | 그린스마트시티학과 포트폴리오</title>
  <meta name="description" content="상명대학교 그린스마트시티학과 3학년 권윤아의 개인 포트폴리오 웹사이트입니다." />

  <!-- 백엔드 주소를 고정하고 싶을 때 content 를 채우세요. 비우면 자동 판별합니다.
       예) <meta name="api-base" content="https://api.example.com/api" /> -->
  <meta name="api-base" content="" />

  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body class="theme-paper">

  <div id="app">

    <!-- ① 첫 장면: 누르면 책장으로 (ui/welcome.js) -->
    <section class="welcome" id="welcome" aria-label="첫 화면">
      <div class="welcome-content" id="welcome-content"><!-- render/welcome.js --></div>
    </section>

    <!-- ② 메인 화면: 책장. 책을 누르면 펼쳐짐 (render/library.js · ui/flipbook.js) -->
    <main class="library" id="library" hidden>
      <header class="library-bar">
        <button type="button" class="library-home" id="library-home">← 처음으로</button>
        <a class="library-link" href="/reservation.html">방문 예약 ↗</a>
      </header>

      <div class="library-head">
        <p class="library-kicker">Portfolio</p>
        <h1 class="library-title" id="library-owner">책장</h1>
        <p class="library-lead">읽고 싶은 책을 골라 펼쳐 보세요</p>
      </div>

      <div class="shelf">
        <div class="shelf-books" id="shelf-books"><!-- render/library.js --></div>
        <div class="shelf-board" aria-hidden="true"></div>
        <p class="shelf-caption" id="shelf-caption" aria-live="polite">책을 누르면 펼쳐져요</p>
      </div>

      <!-- 찾아오는 길: 지도 · 주소 · 날씨 (render/library.js) -->
      <section class="visit" id="library-visit" aria-labelledby="visit-title"></section>

      <!-- 방문 예약: 예약 페이지로 이동 -->
      <div class="library-actions">
        <a class="library-reserve" href="/reservation.html">방문 예약하기 →</a>
      </div>

      <footer class="library-footer" id="library-footer"><!-- render/library.js --></footer>
    </main>

  </div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
