<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 아래 두 값은 /api/portfolio 응답으로 덮어써집니다(render/meta.js). -->
  <title>권윤아 | 그린스마트시티학과 포트폴리오</title>
  <meta name="description" content="상명대학교 그린스마트시티학과 3학년 권윤아의 개인 포트폴리오 웹사이트입니다." />

  <!-- 백엔드 주소를 고정하고 싶을 때 content 를 채우세요. 비우면 자동 판별합니다.
       예) <meta name="api-base" content="https://api.example.com/api" /> -->
  <meta name="api-base" content="" />

  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>

  <div id="app">

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
      <div class="nav-container">
        <div class="nav-logo">
          <span class="logo-text">권윤아</span>
          <span class="logo-dot">.</span>
        </div>
        <ul class="nav-links" id="nav-links"><!-- render/navbar.js --></ul>
        <button class="hamburger" id="hamburger" aria-label="메뉴 열기">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

    <!-- Hero -->
    <section class="hero" id="hero">
      <div class="hero-bg"></div>
      <div class="hero-particles" id="particles"><!-- ui/particles.js --></div>
      <div class="hero-content" id="hero-content"><!-- render/hero.js --></div>
      <div class="hero-scroll-indicator">
        <div class="scroll-dot"></div>
      </div>
    </section>

    <!-- About -->
    <section class="section" id="about">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">About Me</span>
          <h2 class="section-title">자기소개</h2>
        </div>
        <div class="about-grid" id="about-grid"><!-- render/about.js --></div>
        <div class="bio-section">
          <div class="bio-text" id="bio-text"><!-- render/about.js --></div>
          <div class="bio-tags" id="bio-tags"><!-- render/about.js --></div>
        </div>
      </div>
    </section>

    <!-- Education -->
    <section class="section section-dark" id="education">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Education</span>
          <h2 class="section-title">학력사항</h2>
        </div>
        <div class="timeline" id="timeline"><!-- render/education.js --></div>
      </div>
    </section>

    <!-- Awards -->
    <section class="section" id="awards">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Awards &amp; Competitions</span>
          <h2 class="section-title">공모전 참여 이력</h2>
        </div>
        <div class="awards-grid" id="awards-grid"><!-- render/awards.js --></div>
      </div>
    </section>

    <!-- Skills -->
    <section class="section section-dark" id="skills">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Interests</span>
          <h2 class="section-title">관심 분야</h2>
        </div>
        <div class="skills-grid" id="skills-grid"><!-- render/skills.js --></div>
      </div>
    </section>

    <!-- Contact -->
    <section class="section" id="contact">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Contact</span>
          <h2 class="section-title">연락처</h2>
        </div>
        <div class="contact-content">
          <p class="contact-intro" id="contact-intro"><!-- render/contact.js --></p>
          <div class="contact-cards" id="contact-cards"><!-- render/contact.js --></div>
        </div>
      </div>
    </section>

    <!-- Location -->
    <section class="section section-dark" id="location">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Location</span>
          <h2 class="section-title">찾아오는 길</h2>
        </div>
        <p class="section-intro" id="location-intro"><!-- render/location.js --></p>
        <div class="location-grid">
          <div class="location-map" id="location-map"><!-- render/location.js --></div>
          <div class="location-info" id="location-info"><!-- render/location.js --></div>
        </div>
      </div>
    </section>

    <!-- Reservation -->
    <section class="section" id="reservation">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">Reservation</span>
          <h2 class="section-title">방문 예약</h2>
        </div>
        <p class="section-intro" id="reservation-intro"><!-- render/reservation.js --></p>

        <!-- 입력 칸은 고정 마크업, 선택지(목적 · 날짜 범위)는 render/reservation.js, 동작은 ui/reservation.js -->
        <form class="reservation-form" id="reservation-form" novalidate>
          <div class="form-row">
            <div class="form-field">
              <label for="reservation-name">이름 <span class="required">*</span></label>
              <input type="text" id="reservation-name" name="name" autocomplete="name" required />
              <p class="field-error" data-error-for="name"></p>
            </div>
            <div class="form-field">
              <label for="reservation-email">이메일 <span class="required">*</span></label>
              <input type="email" id="reservation-email" name="email" autocomplete="email" required />
              <p class="field-error" data-error-for="email"></p>
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="reservation-phone">연락처</label>
              <input type="tel" id="reservation-phone" name="phone" autocomplete="tel" placeholder="010-0000-0000" />
              <p class="field-error" data-error-for="phone"></p>
            </div>
            <div class="form-field">
              <label for="reservation-purpose">방문 목적 <span class="required">*</span></label>
              <select id="reservation-purpose" name="purpose" required><!-- render/reservation.js --></select>
              <p class="field-error" data-error-for="purpose"></p>
            </div>
          </div>

          <div class="form-field">
            <label for="reservation-date">날짜 <span class="required">*</span></label>
            <input type="date" id="reservation-date" name="date" required />
            <p class="field-error" data-error-for="date"></p>
          </div>

          <fieldset class="form-field">
            <legend>시간 <span class="required">*</span></legend>
            <div class="slot-grid" id="reservation-slots">
              <p class="slot-hint">날짜를 먼저 선택해 주세요.</p>
            </div>
            <p class="field-error" data-error-for="time"></p>
          </fieldset>

          <div class="form-field">
            <label for="reservation-message">메모</label>
            <textarea id="reservation-message" name="message" rows="4" maxlength="500" placeholder="미리 알려주실 내용이 있다면 적어 주세요."></textarea>
            <p class="field-error" data-error-for="message"></p>
          </div>

          <button type="submit" class="btn-primary reservation-submit" id="reservation-submit">예약 신청하기</button>
          <p class="form-status" id="reservation-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-inner" id="footer-inner"><!-- render/footer.js --></div>
    </footer>

  </div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
