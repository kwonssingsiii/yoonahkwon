<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
  <title>관리자 | 권윤아 포트폴리오</title>
</head>
<body class="admin-body">

  <!-- 로그인 후에만 보이는 관리자 헤더 (탭은 src/js/admin/session.js) -->
  <header class="admin-header" id="admin-header" hidden>
    <div class="admin-header-inner">
      <a href="/admin.html" class="admin-brand">권윤아<span class="logo-dot">.</span> <small>관리자</small></a>
      <div class="admin-header-right">
        <span class="admin-user"></span>
        <nav class="admin-tabs" aria-label="관리자 메뉴"></nav>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <!-- 로그인 -->
    <section class="admin-card admin-login" id="admin-login" hidden>
      <h1 class="admin-title">관리자 로그인</h1>
      <form id="admin-login-form" class="admin-login-form">
        <div class="form-field">
          <label for="admin-email">이메일</label>
          <input type="email" id="admin-email" name="email" autocomplete="username" required />
        </div>
        <div class="form-field">
          <label for="admin-password">비밀번호</label>
          <input type="password" id="admin-password" name="password" autocomplete="current-password" required />
        </div>
        <p class="field-error" id="admin-login-error" role="alert"></p>
        <button type="submit" class="btn-primary reserve-button">로그인</button>
      </form>
    </section>

    <!-- 관리자 홈 -->
    <section class="admin-card" id="admin-home" hidden>
      <h1 class="admin-title">관리자 홈</h1>
      <p class="admin-text" id="admin-home-message">오른쪽 위 탭에서 관리할 항목을 선택하세요.</p>
      <div class="admin-home-links" id="admin-home-links">
        <a href="/admin-reservations.html" class="admin-link-card">
          <strong>📅 예약하기관리</strong>
          <span>방문 예약 요청을 확인하고 처리 상태(접수 · 확정 · 변경 요청 · 취소)를 바꿉니다.</span>
        </a>
      </div>
    </section>
  </main>

  <script type="module" src="/src/js/admin/login.js"></script>
</body>
</html>
